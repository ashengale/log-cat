<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <title>하냥맘바 발췌기</title>
  <!-- 한글 웹폰트 -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&family=Gowun+Dodum&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/subsets/MaruBuri-dynamic-subset.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0/dotum.min.css" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/TetraTheta/RIDIBatang-subset/dist/style/RIDIBatang-subset-web.css" />
  <!-- 일본어 폰트 -->
  <link rel="stylesheet" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-jp-dynamic-subset.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
    
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    crossorigin="anonymous"></script>
  <style>
    @font-face {
      font-family: 'Chosunilbo_myungjo';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    :root {
      --paper: #ffffff;
      --stage: #f2f2f1;
      --tint: #fafafa;
      --line: #ededec;
      --line2: #dededc;
      --fg: #111214;
      --fg2: #5e6165;
      --fg3: #9a9c9f;
      --ink: #111214;
      --ink-soft: #f3f3f2;
      --danger: #a3352a;
      --r: 3px;
      --tap: 34px;
      --panelW: 360px;
      --sheetH: 56vh;
      --kb: 0px;
      --kbon: 0;
      --ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden
    }

    body {
      background: var(--paper);
      color: var(--fg);
      font-family: 'Pretendard', var(--ui);
      font-size: 13px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      text-align: left
    }

    :focus-visible {
      outline: 1.5px solid var(--ink);
      outline-offset: 2px
    }

    ::-webkit-scrollbar {
      width: 11px;
      height: 11px
    }

    ::-webkit-scrollbar-thumb {
      background: #d7d7d5;
      border-radius: 0;
      border: 4px solid transparent;
      background-clip: content-box
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #b9b9b6;
      background-clip: content-box
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    /* ===== 골격 ===== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: var(--paper)
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      height: 46px;
      padding-top: env(safe-area-inset-top);
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
      min-width: 0;
      z-index: 80
    }

    .logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      white-space: nowrap;
      flex: 0 0 auto;
      text-transform: uppercase;
      padding-right: 14px;
      border-right: 1px solid var(--line);
      line-height: 1
    }

    .topright {
      margin-left: auto;
      display: flex;
      gap: 7px;
      flex: 0 0 auto;
      align-items: center
    }

    @media (max-width:620px) {
      .logo {
        display: none
      }

      .topbar {
        gap: 10px
      }
    }

    .main {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
      min-width: 0;
      overflow: hidden
    }

    /* 결과물 영역 */
    .view {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--stage)
    }

    .viewbar {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 10px;
      height: 38px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      overflow-x: auto;
      scrollbar-width: none;
      flex: 0 0 auto
    }

    .viewbar::-webkit-scrollbar {
      display: none
    }

    .viewbar .sp {
      flex: 1 1 auto;
      min-width: 6px
    }

    .vb {
      height: 26px;
      padding: 0 8px;
      font-size: 11.5px;
      color: var(--fg2);
      border-radius: var(--r);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    .vb:hover {
      background: var(--ink-soft);
      color: var(--fg)
    }

    .vb.on {
      background: var(--ink);
      color: #fff
    }

    .vb.dg {
      color: var(--danger)
    }

    .zoom {
      display: flex;
      align-items: center;
      gap: 0;
      margin-right: 4px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: var(--r)
    }

    .zoom button {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      font-size: 12px;
      color: var(--fg2)
    }

    .zoom button:hover {
      background: var(--ink-soft);
      color: var(--fg)
    }

    .zoom .z {
      font-size: 10.5px;
      color: var(--fg3);
      min-width: 40px;
      text-align: center;
      font-family: var(--mono);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      height: 25px;
      line-height: 25px
    }

    .zoom .zf {
      font-size: 10.5px;
      width: auto;
      padding: 0 7px
    }

    .stage {
      flex: 1 1 auto;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 26px 16px 34px;
      min-height: 0
    }

    .fitbox {
      margin: 0 auto;
      position: relative
    }

    .scaler {
      transform-origin: top left
    }

    .card {
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(17, 18, 20, .09)
    }

    .card .bgi,
    .card .bgo {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    .card .bgi {
      background-position: center;
      background-repeat: no-repeat
    }

    .meta {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin: 14px auto 0;
      font-size: 10.5px;
      color: var(--fg3);
      font-family: var(--mono);
      letter-spacing: .02em
    }

    .meta b {
      color: var(--fg2);
      font-weight: 500
    }

    .meta .w {
      color: #8a6a1f;
      font-family: var(--ui)
    }


    /* 패널 헤더 */
    .phead {
      flex: 0 0 auto;
      background: var(--paper);
      border-bottom: 1px solid var(--line)
    }

    .phrow {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px 7px
    }

    .phrow .t {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      color: var(--fg3);
      text-transform: uppercase
    }

    .phrow .sp {
      flex: 1 1 auto
    }

    .szb {
      width: 26px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line2);
      border-radius: var(--r);
      font-size: 10px;
      color: var(--fg2);
      line-height: 1
    }

    .szb:hover {
      background: var(--tint)
    }

    .szb.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff
    }

    /* 편집 섹션 */
    .edsec {
      padding: 12px 0 14px;
      border-bottom: 1px solid var(--line)
    }

    .kindrow {
      display: flex;
      gap: 0;
      margin-bottom: 9px;
      border: 1px solid var(--line2);
      border-radius: var(--r);
      overflow: hidden
    }

    .kindrow button {
      flex: 1 1 auto;
      height: 29px;
      font-size: 11px;
      color: var(--fg2);
      display: grid;
      place-items: center;
      border-left: 1px solid var(--line)
    }

    .kindrow button:first-child {
      border-left: 0
    }

    .kindrow button.on {
      background: var(--ink);
      color: #fff;
      font-weight: 600
    }

    .fmt {
      position: sticky;
      top: 0;
      z-index: 6;
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: center;
      padding: 7px 0;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      margin-bottom: 0
    }

    .fmt .gap {
      width: 1px;
      height: 15px;
      background: var(--line);
      margin: 0 3px
    }

    .field {
      border: 1px solid var(--line2);
      border-top: 0;
      border-radius: 0 0 var(--r) var(--r);
      padding: 10px;
      min-height: 96px;
      max-height: 38vh;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.7;
      outline: none;
      -webkit-user-select: text;
      user-select: text
    }

    .field:focus {
      border-color: var(--ink)
    }

    .field:empty::before {
      content: attr(data-ph);
      color: var(--fg3);
      font-size: 12.5px;
      line-height: 1.7
    }

    .field .hl {
      padding: .02em .08em
    }

    .fieldbar {
      display: flex;
      gap: 5px;
      margin-top: 8px;
      flex-wrap: wrap
    }

    .fieldbar>.btn {
      flex: 1 1 auto
    }

    .actrow {
      display: flex;
      gap: 3px;
      margin-top: 6px;
      flex-wrap: wrap
    }

    .bound {
      font-size: 10px;
      color: var(--fg3);
      font-family: var(--mono);
      margin-top: 7px
    }

    .bound b {
      color: var(--fg2);
      font-weight: 500
    }

    /* 서명 고정 */
    .signsec {
      padding: 13px 0 15px;
      border-bottom: 1px solid var(--line)
    }

    .signrow {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .signrow input {
      flex: 1 1 auto;
      text-align: center;
      min-height: 30px
    }

    .signrow select {
      width: 52px;
      flex: 0 0 auto;
      text-align: center;
      min-height: 30px;
      padding: 0 4px;
      background-image: none
    }

    /* 편집바 */
    .resizer {
      flex: 0 0 auto;
      width: 9px;
      cursor: col-resize;
      background: var(--paper);
      border-left: 1px solid var(--line);
      position: relative;
      touch-action: none
    }

    .resizer::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: transparent
    }

    .resizer:hover::after,
    .resizer.on::after {
      background: var(--ink)
    }

    .panel {
      display: flex;
      flex-direction: column;
      background: var(--paper);
      flex: 0 0 auto;
      min-height: 0;
      min-width: 0
    }

    .pbody {
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 16px 30px;
      min-height: 0
    }

    .grip {
      display: none
    }

    @media (min-width:960px) {
      .main {
        flex-direction: row
      }

      .panel {
        width: var(--panelW)
      }
    }

    @media (max-width:959px) {
      .main {
        flex-direction: column;
        position: relative
      }

      .resizer {
        display: none
      }

      .stage {
        padding: 14px 12px calc(var(--sheetH) + 10px)
      }

      .panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: var(--kb, 0px);
        z-index: 70;
        height: var(--sheetH);
        max-height: calc(100dvh - 46px - var(--kb, 0px));
        border-top: 1px solid var(--line2);
        box-shadow: 0 -1px 0 rgba(17, 18, 20, .05);
        padding-bottom: calc(env(safe-area-inset-bottom) * (1 - var(--kbon, 0)))
      }

      .panel.min {
        height: 62px !important
      }

      .grip {
        display: block;
        width: 100%;
        height: 22px;
        position: relative;
        flex: 0 0 auto;
        touch-action: none;
        cursor: ns-resize
      }

      .grip::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 9px;
        transform: translateX(-50%);
        width: 30px;
        height: 3px;
        border-radius: 2px;
        background: #cfcfcc
      }

      .grip:active::after,
      .grip.on::after {
        background: var(--ink)
      }

      .field {
        max-height: 32vh
      }

      :root {
        --tap: 38px
      }

      input[type=text],
      input[type=number],
      select,
      textarea {
        font-size: 16px
      }
    }

    /* ===== 컨트롤 ===== */
    .btn {
      min-height: var(--tap);
      padding: 0 12px;
      border-radius: var(--r);
      background: transparent;
      border: 1px solid var(--line2);
      font-size: 12.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: background .1s, border-color .1s, color .1s
    }

    .btn:hover {
      background: var(--tint);
      border-color: #c8c8c5
    }

    .btn.sm {
      min-height: 28px;
      padding: 0 9px;
      font-size: 11.5px
    }

    .btn.ico {
      min-width: var(--tap);
      padding: 0 8px
    }

    .btn.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff
    }

    .btn.pri {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
      font-weight: 600;
      letter-spacing: .01em
    }

    .btn.pri:hover {
      background: #2c2e32;
      border-color: #2c2e32
    }

    .btn.gho {
      border-color: transparent;
      color: var(--fg2)
    }

    .btn.gho:hover {
      background: var(--tint);
      border-color: var(--line)
    }

    .btn.del {
      color: var(--danger);
      border-color: #e8d8d5
    }

    .btn.del:hover {
      background: #fcf6f5;
      border-color: #dcc0bb
    }

    .btn:disabled {
      opacity: .4;
      cursor: default
    }

    .seg {
      display: flex;
      gap: 5px;
      flex-wrap: wrap
    }

    .seg>.btn {
      flex: 1 1 auto
    }

    .seg.tight {
      gap: 0
    }

    .seg.tight>.btn {
      border-radius: 0;
      margin-left: -1px
    }

    .seg.tight>.btn:first-child {
      border-radius: var(--r) 0 0 var(--r);
      margin-left: 0
    }

    .seg.tight>.btn:last-child {
      border-radius: 0 var(--r) var(--r) 0
    }

    .seg.tight>.btn.on {
      position: relative;
      z-index: 1
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
      min-height: 28px
    }

    .row:last-child {
      margin-bottom: 0
    }

    .row>label {
      flex: 0 0 66px;
      font-size: 11.5px;
      color: var(--fg2)
    }

    .row .val {
      margin-left: auto;
      font-size: 10.5px;
      color: var(--fg3);
      min-width: 44px;
      text-align: right;
      font-family: var(--mono)
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1 1 auto;
      height: 18px;
      background: none;
      min-width: 0
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 1px;
      background: var(--line2)
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--ink);
      border: 0;
      margin-top: -5px
    }

    input[type=range]::-moz-range-track {
      height: 1px;
      background: var(--line2)
    }

    input[type=range]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 0;
      border-radius: 50%;
      background: var(--ink)
    }

    input[type=text],
    input[type=number],
    select,
    textarea {
      background: var(--paper);
      border: 1px solid var(--line2);
      border-radius: var(--r);
      padding: 0 9px;
      min-height: var(--tap);
      width: 100%;
      font-size: 12.5px;
      min-width: 0
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--ink);
      outline: none
    }

    textarea {
      padding: 10px;
      line-height: 1.65;
      resize: vertical;
      min-height: 80px
    }

    select {
      -webkit-appearance: none;
      appearance: none;
      padding-right: 24px;
      background-image: linear-gradient(45deg, transparent 50%, var(--fg2) 50%), linear-gradient(135deg, var(--fg2) 50%, transparent 50%);
      background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat
    }

    input[type=color] {
      -webkit-appearance: none;
      appearance: none;
      border: 1px solid var(--line2);
      border-radius: var(--r);
      width: 34px;
      height: 26px;
      padding: 0;
      background: none;
      flex: 0 0 auto;
      cursor: pointer
    }

    input[type=color]::-webkit-color-swatch-wrapper {
      padding: 2px
    }

    input[type=color]::-webkit-color-swatch {
      border: 0;
      border-radius: 1px
    }

    .chk {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--fg2);
      min-height: 29px;
      cursor: pointer
    }

    .chk input {
      width: 15px;
      height: 15px;
      accent-color: var(--ink);
      flex: 0 0 auto;
      border-radius: 0
    }

    .chk b {
      color: var(--fg);
      font-weight: 600
    }

    .hint {
      font-size: 11px;
      color: var(--fg3);
      line-height: 1.65;
      margin: 8px 0 0
    }

    .hint code {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--fg2);
      background: var(--ink-soft);
      padding: 1px 4px
    }

    /* 작성 영역 */
    .composer {
      padding: 14px 0 16px;
      border-bottom: 1px solid var(--line)
    }

    .composer h4 {
      margin: 0 0 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      color: var(--fg3);
      display: flex;
      align-items: baseline;
      gap: 8px;
      text-transform: uppercase
    }

    .composer h4 span {
      margin-left: auto;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--fg3);
      font-family: var(--mono);
      text-transform: none
    }

    .kind {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin-bottom: 11px;
      border: 1px solid var(--line2);
      border-radius: var(--r)
    }

    .kind button {
      flex: 1 1 auto;
      height: 30px;
      font-size: 11.5px;
      color: var(--fg2);
      display: grid;
      place-items: center;
      border-left: 1px solid var(--line)
    }

    .kind button:first-child {
      border-left: 0
    }

    .kind button:hover {
      background: var(--tint)
    }

    .kind button.on {
      background: var(--ink);
      color: #fff;
      font-weight: 600
    }

    .fmtbar {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      padding: 7px 0 3px
    }

    .fb {
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      border-radius: var(--r);
      border: 1px solid var(--line2);
      background: var(--paper);
      font-size: 11.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--fg)
    }

    .fb:hover {
      background: var(--tint)
    }

    .fb.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff
    }

    .fb .dot {
      width: 10px;
      height: 10px;
      border-radius: 1px;
      box-shadow: inset 0 0 0 1px rgba(17, 18, 20, .22)
    }

    /* 도구 목록 */
    .tools>h4 {
      margin: 16px 0 2px;
      font-size: 10px;
      font-weight: 700;
      color: var(--fg3);
      letter-spacing: .14em;
      text-transform: uppercase
    }

    .acc {
      border-bottom: 1px solid var(--line)
    }

    .acc:first-of-type {
      border-top: 1px solid var(--line)
    }

    .acc>.h {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 2px;
      font-size: 12.5px;
      font-weight: 500
    }

    .acc>.h .ic {
      width: 15px;
      text-align: center;
      color: var(--fg3);
      font-size: 11px
    }

    .acc>.h::after {
      content: "+";
      margin-left: auto;
      color: var(--fg3);
      font-size: 13px;
      line-height: 1;
      width: 12px;
      text-align: center
    }

    .acc.open>.h {
      font-weight: 700
    }

    .acc.open>.h::after {
      content: "–"
    }

    .acc>.b {
      display: none;
      padding: 2px 2px 16px
    }

    .acc.open>.b {
      display: block
    }

    .sub {
      margin: 14px 0 8px;
      font-size: 10px;
      font-weight: 700;
      color: var(--fg3);
      letter-spacing: .12em;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--line);
      text-transform: uppercase
    }

    .sub:first-child {
      margin-top: 4px
    }

    .sw {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(20px, 1fr));
      gap: 4px
    }

    .sw button {
      aspect-ratio: 1;
      border-radius: 1px;
      box-shadow: inset 0 0 0 1px rgba(17, 18, 20, .16)
    }

    .sw button:hover {
      outline: 1px solid var(--ink);
      outline-offset: 1px
    }

    /* 인물 */
    .people {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 10px;
      border-top: 1px solid var(--line)
    }

    .pitem {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 2px;
      border-bottom: 1px solid var(--line);
      cursor: pointer
    }

    .pitem:hover {
      background: var(--tint)
    }

    .pitem.on {
      background: var(--ink-soft)
    }

    .pitem .av {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e6e6e4;
      overflow: hidden;
      flex: 0 0 auto
    }

    .pitem .av img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .pitem .nm {
      flex: 1 1 auto;
      font-size: 12.5px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .pitem .sd {
      font-size: 10px;
      color: var(--fg3);
      font-family: var(--mono)
    }

    .pitem .bd {
      width: 12px;
      height: 12px;
      border-radius: 1px;
      box-shadow: inset 0 0 0 1px rgba(17, 18, 20, .16)
    }

    .empty {
      font-size: 11.5px;
      color: var(--fg3);
      padding: 10px 2px;
      border-bottom: 1px solid var(--line)
    }

    .box {
      border: 1px solid var(--line2);
      border-radius: var(--r);
      padding: 12px;
      margin-top: 10px;
      background: var(--tint)
    }

    .box h5 {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--fg2)
    }

    /* 모달 */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(17, 18, 20, .34);
      padding: 16px
    }

    .modal.on {
      display: flex
    }

    .mbox {
      background: var(--paper);
      border-radius: var(--r);
      padding: 18px;
      width: 100%;
      max-width: 352px;
      max-height: 92dvh;
      overflow: auto;
      box-shadow: 0 20px 60px rgba(17, 18, 20, .22)
    }

    .mbox h3 {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .02em
    }

    .mbox p.d {
      margin: 0 0 14px;
      font-size: 11px;
      color: var(--fg3)
    }

    .cropwrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: var(--ink-soft);
      overflow: hidden;
      touch-action: none;
      cursor: grab;
      margin-bottom: 12px
    }

    .cropwrap canvas {
      width: 100%;
      height: 100%;
      display: block
    }

    .cropwrap .mask {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(255, 255, 255, .62)
    }

    .cropwrap .mask.sq {
      border-radius: 2px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 20px);
      transform: translate(-50%, 18px);
      z-index: 300;
      background: var(--ink);
      color: #fff;
      padding: 9px 14px;
      border-radius: var(--r);
      font-size: 11.5px;
      opacity: 0;
      transition: opacity .18s, transform .18s;
      pointer-events: none;
      max-width: 86vw;
      text-align: center
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .busy {
      position: fixed;
      inset: 0;
      z-index: 250;
      display: none;
      place-items: center;
      background: rgba(255, 255, 255, .9);
      font-size: 11.5px;
      color: var(--fg2)
    }

    .busy.on {
      display: grid
    }

    .spin {
      width: 18px;
      height: 18px;
      border: 1px solid var(--line2);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: sp .7s linear infinite;
      margin: 0 auto 10px
    }

    @keyframes sp {
      to {
        transform: rotate(360deg)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }

    /* ===================== 결과물 (발췌 카드) ===================== */
    .doc {
      position: relative;
      z-index: 2;
      font-family: var(--ff);
      color: var(--tc);
      text-align: var(--ta);
      font-size: var(--fs);
      line-height: var(--lhpx);
      letter-spacing: var(--ls);
      font-weight: var(--fw);
      transform: none;
      text-shadow: var(--tsh)
    }

    .doc.cols {
      column-count: var(--cols);
      column-gap: var(--cgap);
      column-fill: balance
    }

    .doc .b {
      margin: 0 0 var(--para);
      position: relative;
      break-inside: avoid-column
    }

    .doc .b:last-child {
      margin-bottom: 0 !important
    }

    .doc .stretch {
      display: inline-block;
      transform: scaleX(var(--sx));
      transform-origin: left center
    }

    .doc[style*="--ta:center"] .stretch {
      transform-origin: center
    }

    /* 제목 · 부제 */
    .doc .k-title {
      font-size: var(--tsz);
      line-height: 1.3;
      letter-spacing: -.02em;
      margin-bottom: var(--tgap)
    }

    .doc .k-title[data-w="400"] {
      font-weight: 400
    }

    .doc .k-title[data-w="600"] {
      font-weight: 600
    }

    .doc .k-title[data-w="700"] {
      font-weight: 700
    }

    .doc .k-title[data-w="900"] {
      font-weight: 900
    }

    .doc .k-sub {
      font-size: var(--ssz);
      line-height: 1.45;
      color: var(--sub);
      margin-bottom: var(--sgap)
    }

    .doc .k-sub[data-w="400"] {
      font-weight: 400
    }

    .doc .k-sub[data-w="700"] {
      font-weight: 700
    }

    /* 구분선 · 사진 */
    .doc .k-div {
      display: flex;
      justify-content: center;
      align-items: center
    }

    .doc .k-div i {
      display: block;
      height: 0;
      border-top: var(--dvw) var(--dvs) var(--dvc);
      width: var(--len)
    }

    .doc .k-div[data-style="dots"] i {
      border: 0;
      height: auto;
      color: var(--dvc);
      letter-spacing: .55em;
      font-size: .9em;
      text-align: center;
      line-height: 1
    }

    .doc .k-div[data-style="dots"] i::before {
      content: "• • •"
    }

    .doc .k-img {
      text-align: center
    }

    .doc .k-img img {
      max-width: 100%;
      width: var(--iw);
      border-radius: var(--irad);
      display: inline-block
    }

    /* 인용 · 강조 */
    .doc .k-quote {
      padding: .15em 0 .15em 1em;
      border-left: 4px solid var(--lineA)
    }

    .doc .k-center {
      text-align: center
    }

    .doc .k-page {
      border-top: 1px dashed var(--fg3);
      opacity: .5;
      text-align: center;
      font-size: .62em;
      color: var(--fg3);
      padding-top: .2em;
      letter-spacing: .2em
    }

    .card.export .k-page {
      display: none
    }

    /* 인라인 효과 */
    .doc .hl {
      border-radius: .14em;
      padding: .02em .08em
    }

    .doc .hl-a {
      background: var(--hlA)
    }

    .doc .hl-b {
      background: var(--hlB)
    }

    .doc .hl-c {
      background: var(--hlC)
    }

    .doc .ul-a {
      background: linear-gradient(transparent 58%, var(--lineA) 58%, var(--lineA) 96%, transparent 96%)
    }

    .doc .ul-b {
      background: linear-gradient(transparent 92%, var(--lineB) 92%)
    }

    .doc .q-a {
      color: var(--qA)
    }

    .doc .q-b {
      color: var(--qB)
    }

    .doc .pr {
      color: var(--prC)
    }

    .doc i[data-mk] {
      font-style: inherit
    }

    .doc,
    .doc * {
      font-family: inherit
    }

    .doc.hidemk i[data-mk] {
      display: none
    }

    .doc.hideq .k-chat .bb i[data-mk] {
      display: none
    }

    .doc s {
      text-decoration-thickness: 1px
    }

    /* 말풍선 */
    .doc .k-chat {
      display: flex;
      gap: calc(.42em + 2px);
      align-items: flex-start;
      margin-bottom: var(--bgap);
      text-align: left
    }

    .doc .k-chat.right {
      flex-direction: row-reverse
    }

    .doc .k-chat .av {
      width: var(--av);
      height: var(--av);
      flex: 0 0 auto;
      border-radius: 50%;
      overflow: hidden;
      background: #d9d6d0;
      align-self: flex-start;
      margin-top: 0
    }

    /* 말풍선 위쪽 끝이 프사의 중간 높이에 오도록 프사를 올린다 */
    .doc .k-chat .av {
      margin-top: max(-10px, calc(var(--av) / -2))
    }

    .doc .k-chat.nmon .av {
      margin-top: max(-10px, calc(var(--nsz) * 1.3 + var(--fs) * 0.14 - var(--av) / 2))
    }

    /* 묶인 말풍선(프사 숨김)은 자리만 차지하도록 원위치 */
    .doc .k-chat.hideav .av {
      margin-top: 0
    }

    .doc .k-chat.avsq .av {
      border-radius: 26%
    }

    .doc .k-chat .av img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .doc .k-chat.hideav .av {
      visibility: hidden
    }

    .doc .k-chat.noav .av {
      display: none
    }

    .doc .k-chat .col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: .14em;
      min-width: 0;
      max-width: var(--bmax);
      position: relative
    }


    .doc .k-chat.right .col {
      align-items: flex-end
    }

    .doc .k-chat .nm {
      font-size: var(--nsz);
      font-weight: 600;
      line-height: 1.3;
      padding: 0 .5em;
      position: relative;
      top: -2px
    }

    .doc .k-chat.nonm .nm,
    .doc .k-chat.mid .nm,
    .doc .k-chat.last .nm {
      display: none
    }

    .doc .k-chat .bb {
      padding: var(--bpv) var(--bph);
      border-radius: var(--brad);
      white-space: pre-wrap;
      position: relative;
      font-size: var(--bsz);
      line-height: var(--blh);
      box-shadow: var(--bsh)
    }

    /* 말하는 쪽 위 모서리만 각지게 (꼬리가 붙는 자리) */
    .doc .k-chat.left .bb {
      border-top-left-radius: var(--bsharp)
    }

    .doc .k-chat.right .bb {
      border-top-right-radius: var(--bsharp)
    }

    .doc .k-chat .tail {
      position: absolute;
      top: 0;
      width: .58em;
      height: .9em;
      display: none;
      pointer-events: none;
      overflow: visible
    }

    .doc .k-chat.left .tail {
      left: -.32em;
      transform: scaleY(-1)
    }

    .doc .k-chat.right .tail {
      right: -.32em;
      transform: scale(-1, -1)
    }

    .doc .k-chat.tailon .tail {
      display: block
    }

    .doc .k-chat.tcard .bb,
    .doc .k-chat.tedge .bb {
      box-shadow: none;
      border: var(--btw) solid var(--btc)
    }

    .doc .k-chat.tedge .bb {
      border-radius: .28em
    }

    .doc .k-chat.tcard .bb {
      border-radius: .5em;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08)
    }

    .doc .k-chat.tcard .tail,
    .doc .k-chat.tedge .tail {
      display: none
    }

    .doc .k-chat .bq {
      opacity: .55
    }

    /* 빈 상태 */
    .doc .ph {
      border: 1px dashed rgba(120, 120, 120, .35);
      border-radius: 8px;
      padding: 1.4em 1em;
      text-align: center;
      color: var(--sub);
      font-size: .92em;
      line-height: 1.7
    }

    .card.export .ph {
      display: none
    }

    /* 편집 상태 */
    .doc .b[contenteditable="true"] {
      outline: none
    }

    .doc .b.sel {
      box-shadow: 0 0 0 1px #111214;
      border-radius: 2px
    }

    .doc .b:hover:not(.sel) {
      box-shadow: 0 0 0 1px rgba(17, 18, 20, .16);
      border-radius: 2px
    }

    .doc.picking .b {
      cursor: pointer
    }

    .doc .b .cb {
      position: absolute;
      left: -1.35em;
      top: .1em;
      width: 1.05em;
      height: 1.05em;
      display: none;
      border: 1px solid #111214;
      border-radius: 1px;
      background: rgba(255, 255, 255, .9);
      z-index: 5;
      font-size: .8em;
      line-height: 1;
      align-items: center;
      justify-content: center;
      color: #111214;
      font-weight: 700
    }

    .doc.picking .b .cb {
      display: flex
    }

    .doc .b.checked .cb::after {
      content: "✓"
    }

    .doc .b.checked {
      box-shadow: 0 0 0 1px #a3352a;
      border-radius: 2px
    }

    .doc.moving .b {
      cursor: grab;
      touch-action: none;
      box-shadow: 0 0 0 1px rgba(17, 18, 20, .2);
      border-radius: 2px
    }

    .doc.moving .b.drag {
      opacity: .35
    }

    .card.export .b {
      box-shadow: none !important
    }

    .card.export .cb {
      display: none !important
    }

    /* 서명 · 페이지 번호 */
    .sign {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: baseline;
      gap: .55em;
      font-size: var(--sgsz);
      color: var(--sgc);
      padding-top: max(20px, var(--sggap));
      justify-content: var(--sgal);
      letter-spacing: .02em;
      font-family: var(--ff)
    }

    .sign .sep {
      opacity: .6
    }

    .sign .pg {
      margin-left: .8em;
      opacity: .75
    }

    /* ===================== 편집바 정리 ===================== */
    .pbody {
      padding: 0 15px 34px
    }

    /* 패널 헤더: 얇고 조용하게 */
    .phead {
      box-shadow: 0 1px 0 rgba(17, 18, 20, .04)
    }

    .phrow {
      padding: 0 15px 8px
    }

    .phrow .t {
      font-size: 9.5px;
      letter-spacing: .16em;
      color: var(--fg3)
    }

    .szb {
      width: 24px;
      height: 22px;
      font-size: 9px;
      color: var(--fg3);
      border-color: var(--line)
    }

    .szb.on {
      color: #fff
    }

    /* 섹션 간격 */
    .edsec {
      padding: 14px 0 16px
    }

    .signsec {
      padding: 16px 0 18px
    }

    /* 종류 선택: 여유 있게 */
    .kindrow {
      margin-bottom: 11px;
      border-color: var(--line)
    }

    .kindrow button {
      height: 33px;
      font-size: 11.5px;
      letter-spacing: -.01em;
      transition: background .1s, color .1s
    }

    .kindrow button:not(.on):hover {
      background: var(--ink-soft)
    }

    /* 서식 바 + 입력칸을 한 덩어리로 */
    .fmt {
      padding: 8px 9px;
      gap: 4px;
      border: 1px solid var(--line2);
      border-bottom: 0;
      border-radius: var(--r) var(--r) 0 0;
      background: var(--tint);
      margin-bottom: 0
    }

    .fmt .gap {
      height: 14px;
      background: var(--line2);
      opacity: .8
    }

    .fb {
      min-width: 27px;
      height: 27px;
      border-color: var(--line2);
      background: var(--paper);
      color: var(--fg2);
      font-size: 11px
    }

    .fb:hover {
      color: var(--fg);
      border-color: #c4c4c0
    }

    .field {
      padding: 11px 12px;
      font-size: 14px;
      line-height: 1.75;
      min-height: 104px;
      background: var(--paper)
    }

    .field:focus {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink)
    }

    /* 추가 / 새 블록 */
    .fieldbar {
      margin-top: 9px;
      gap: 6px
    }

    .fieldbar>.btn {
      min-height: 36px
    }

    /* 블록 조작 줄 */
    .actrow {
      margin-top: 7px;
      gap: 4px;
      align-items: center
    }

    .actrow .fb {
      min-width: 30px;
      height: 29px
    }

    .actrow .chk {
      font-size: 11px;
      color: var(--fg3);
      gap: 6px
    }

    /* 대사 일괄 변경 */
    .autorow {
      display: flex;
      gap: 6px;
      margin-top: 8px
    }

    .autorow>.btn {
      flex: 1 1 auto;
      color: var(--fg2)
    }

    .bound {
      margin-top: 10px;
      padding: 7px 9px;
      background: var(--tint);
      border-radius: var(--r);
      border: 1px solid var(--line);
      font-size: 10.5px;
      line-height: 1.55;
      color: var(--fg3)
    }

    .bound b {
      color: var(--fg);
      font-weight: 600
    }

    /* 서명 입력 */
    .signrow input {
      min-height: 33px
    }

    .signrow select {
      min-height: 33px;
      color: var(--fg2)
    }

    /* 도구 아코디언 */
    .tools>h4 {
      margin: 20px 0 4px
    }

    .acc>.h {
      padding: 13px 2px;
      font-size: 12.5px;
      color: var(--fg2)
    }

    .acc>.h:hover {
      color: var(--fg)
    }

    .acc.open>.h {
      color: var(--fg)
    }

    .acc>.h .ic {
      font-size: 10.5px
    }

    .acc>.b {
      padding: 4px 2px 18px
    }

    /* 소제목: 선 대신 여백으로 구분 */
    .sub {
      margin: 16px 0 9px;
      padding-bottom: 0;
      border-bottom: 0;
      font-size: 9.5px;
      letter-spacing: .14em;
      color: var(--fg3)
    }

    .sub:first-child {
      margin-top: 2px
    }

    /* 슬라이더 줄 정렬 */
    .row {
      gap: 11px;
      min-height: 30px;
      margin-bottom: 6px
    }

    .row>label {
      flex: 0 0 62px;
      font-size: 11px;
      color: var(--fg2);
      line-height: 1.35
    }

    .row .val {
      font-size: 10px;
      min-width: 42px
    }

    input[type=range]::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      margin-top: -5.5px;
      box-shadow: 0 0 0 2px var(--paper)
    }

    /* 인물 목록 */
    .pitem {
      padding: 8px 3px
    }

    .pitem .nm {
      font-size: 12px

            <span class="t">편집</span>
            <span class="sp"></span>

            <button class="szb" id="szHalf" title="절반">▄</button>

              <button data-kind="img">사진</button>

            <div class="row" id="rSender" style="display:none"><label>발신자</label><select id="senderSel"></select></div>
            <div class="row" id="rTw" style="display:none"><label>굵기</label>

                <button class="btn sm" data-tw="600">중간</button>

            </div>

            <div class="fieldbar">

              <button class="btn" id="btnNew">새 블록</button>

              <button class="fb" data-act="up" title="위로">↑</button>

            </div>
            <div class="autorow">

                    <button class="btn sm" data-fw="500">중간</button>

            if (p.done) { next.push(p); return; }
            let last = 0, m; re.lastIndex = 0;
            while ((m = re.exec(p.t))) {
              if (m.index > last) next.push({ t: p.t.slice(last, m.index), done: false });
              let inner = null; for (let i = 1; i < m.length; i++) { if (m[i] != null) { inner = m[i]; break; } }
              const full = m[0], half = (full.length - inner.length) / 2;
              next.push({ o: full.slice(0, half), t: inner, c: full.slice(full.length - half), done: true, cls: cls });
              last = m.index + full.length;

          });

        };

        const t = S.bg.type;
        $('#rowBgB').style.display = (t === 'g2' || t === 'g3') ? 'flex' : 'none';
        $('#rowBgC').style.display = (t === 'g3') ? 'flex' : 'none';
        $('#rowBgDir').style.display = (t === 'g2' || t === 'g3') ? 'flex' : 'none';
      }
      $('#btnBgPick').addEventListener('click', () => $('#bgFile').click());
      $('#bgFile').addEventListener('change', e => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        const fr = new FileReader();
        fr.onload = () => shrink(fr.result, 1600, u => { S.bg.imgRaw = u; S.bg.type = 'img'; seg('data-bgt', 'img'); syncBgRows(); rebuildBg(); });
        fr.readAsDataURL(f); e.target.value = '';
      });
      $('#btnBgClr').addEventListener('click', () => { S.bg.imgRaw = null; S.bg.img = null; S.bg.type = 'solid'; seg('data-bgt', 'solid'); syncBgRows(); render(); save(); });
      function rebuildBg() {
        if (!S.bg.imgRaw) { S.bg.img = null; render(); save(); return; }
        if (!S.bg.blur) { S.bg.img = S.bg.imgRaw; render(); save(); return; }
        const im = new Image();
        im.onload = () => {
          const cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height;
          const c = cv.getContext('2d');
          try { c.filter = 'blur(' + (S.bg.blur * (im.width / S.canvas.w)) + 'px)'; } catch (e) { }
          c.drawImage(im, 0, 0);
          try { S.bg.img = cv.toDataURL('image/jpeg', .94); } catch (e) { S.bg.img = S.bg.imgRaw; }
          render(); save();
        };
        im.onerror = () => { S.bg.img = S.bg.imgRaw; render(); save(); };
        im.src = S.bg.imgRaw;
      }
      /* 아코디언 */
      $$('.acc').forEach(a => {
        const k = a.dataset.acc;
        a.querySelector('.h').addEventListener('click', () => {
          a.classList.toggle('open'); S.ui.acc[k] = a.classList.contains('open'); save();
        });
      });
      /* 줌 */
      $('#zIn').addEventListener('click', () => { S.zoom = clamp((S.zoom || curScale()) * 1.15, .2, 3); fit(); save(); });
      $('#zOut').addEventListener('click', () => { S.zoom = clamp((S.zoom || curScale()) / 1.15, .2, 3); fit(); save(); });
      $('#zFit').addEventListener('click', () => { S.zoom = 0; fit(); save(); });
      function curScale() { return Math.min(1, (stage.clientWidth - 28) / S.canvas.w); }
      /* 편집바 크기 */
      (function () {
        const rz = $('#resizer'); let on = false;
        rz.addEventListener('pointerdown', e => { on = true; rz.classList.add('on'); rz.setPointerCapture(e.pointerId); e.preventDefault(); });
        rz.addEventListener('pointermove', e => {
          if (!on) return;
          S.panelW = Math.round(clamp(window.innerWidth - e.clientX, 280, Math.min(640, window.innerWidth - 320)));
          document.documentElement.style.setProperty('--panelW', S.panelW + 'px'); fit();
        });
        ['pointerup', 'pointercancel'].forEach(ev => rz.addEventListener(ev, () => { if (on) { on = false; rz.classList.remove('on'); save(); } }));
        const g = $('#grip'); let dg = false, sy = 0, h0 = 0, dy = 0;
        g.addEventListener('pointerdown', e => { dg = true; dy = 0; sy = e.clientY; h0 = $('#panel').offsetHeight; g.classList.add('on'); g.setPointerCapture(e.pointerId); });
        g.addEventListener('pointermove', e => {
          if (!dg) return; dy = e.clientY - sy;
          const h = clamp(h0 - dy, 90, window.innerHeight * .92);
          S.sheetH = Math.round(h / window.innerHeight * 100);
          $('#panel').classList.remove('min');
          document.documentElement.style.setProperty('--sheetH', S.sheetH + 'vh'); fit();
        });
        ['pointerup', 'pointercancel'].forEach(ev => g.addEventListener(ev, () => {
          if (!dg) return; dg = false; g.classList.remove('on');
          if (Math.abs(dy) < 5) $('#panel').classList.toggle('min');
          save();
        }));
      })();

      /* ===================== 내보내기 ===================== */
      async function renderCanvas() {
        if (typeof flushLive === 'function') flushLive();
        exporting = true; applyVars();
        const wasSel = S.sel; S.sel = -1;
        $$('.b', doc).forEach(e => e.classList.remove('sel'));
        await new Promise(r => setTimeout(r, 30));
        try {
          return await html2canvas(card, {
            scale: S.out.scale, backgroundColor: S.out.transparent ? null : S.bg.a,
            useCORS: true, logging: false, imageTimeout: 0,
            width: S.canvas.w, height: card.offsetHeight,
            windowWidth: Math.max(window.innerWidth, S.canvas.w + 120),
            windowHeight: Math.max(window.innerHeight, card.offsetHeight + 120),
            onclone: cd => {
              const sc = cd.getElementById('scaler'); if (sc) sc.style.transform = 'none';
              const c2 = cd.getElementById('card'); if (c2) { c2.classList.add('export'); c2.style.boxShadow = 'none'; }
              const d2 = cd.getElementById('doc'); if (d2) d2.classList.remove('picking', 'moving');
              Array.prototype.forEach.call(cd.querySelectorAll('[contenteditable]'), x => x.setAttribute('contenteditable', 'false'));
              Array.prototype.forEach.call(cd.querySelectorAll('.sel,.checked,.drag'), x => x.classList.remove('sel', 'checked', 'drag'));
            }
          });
        } finally { exporting = false; S.sel = wasSel; applyVars(); }
      }
      function fileName(i) {
        const base = (S.out.name || 'excerpt').replace(/[\\/:*?"<>|]/g, '');
        const d = new Date(), p = n => String(n).padStart(2, '0');
        const stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
        return base + '_' + stamp + (i != null ? '_' + (i + 1) : '') + (S.out.fmt === 'jpg' ? '.jpg' : '.png');
      }
      function dl(url, name) { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
      async function saveImage() {
        if (typeof html2canvas !== 'function') { toast('변환 스크립트를 불러오지 못했습니다'); return; }
        busy(true, '이미지를 만들고 있습니다…');
        try {
          const cv = await renderCanvas();
          if (!cv || !cv.width || !cv.height) throw new Error('빈 이미지');
          const png = S.out.fmt !== 'jpg';
          const url = cv.toDataURL(png ? 'image/png' : 'image/jpeg', png ? undefined : .96);
          if (!url || url.length < 200) throw new Error('데이터 생성 실패');
          dl(url, fileName());
        } catch (e) { console.error(e); busy(false); alert('저장된 줄 알았지?ㅋ'); }
        finally { busy(false); render(); }
      }
      $('#btnSave').addEventListener('click', saveImage);
      $('#btnCopy').addEventListener('click', async () => {
        if (!navigator.clipboard || !window.ClipboardItem) { alert('저장된 줄 알았지?ㅋ'); return; }
        busy(true, '복사할 이미지를 만들고 있습니다…');
        try {
          const cv = await renderCanvas();
          const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          toast('복사했습니다');
        } catch (e) { console.error(e); busy(false); alert('저장된 줄 알았지?ㅋ'); }
        finally { busy(false); render(); }
      });
      $('#btnSplit').addEventListener('click', async () => {
        const ps = pages();
        if (ps.length < 2) { toast('✂ 로 페이지를 나눈 뒤 사용하세요'); return; }
        busy(true, '페이지를 나눠 저장하고 있습니다…');
        try {
          for (let i = 0; i < ps.length; i++) {
            pageOnly = i; render();
            await new Promise(r => setTimeout(r, 60));
            const cv = await renderCanvas();
            if (!cv || !cv.width) throw new Error('빈 이미지');
            const png = S.out.fmt !== 'jpg';
            dl(cv.toDataURL(png ? 'image/png' : 'image/jpeg', png ? undefined : .96), fileName(i));
            await new Promise(r => setTimeout(r, 180));
          }
        } catch (e) { console.error(e); pageOnly = -1; busy(false); render(); alert('저장된 줄 알았지?ㅋ'); }
        finally { pageOnly = -1; busy(false); render(); }
      });
      $('#btnHtml').addEventListener('click', () => {
        const st = document.querySelector('style').textContent;
        const links = Array.prototype.map.call(
          document.querySelectorAll('link[rel="stylesheet"]'),
          l => '<link rel="stylesheet" crossorigin href="' + l.getAttribute('href') + '">'
        ).join('');
        const wasSel = S.sel; S.sel = -1; render();
        const c = card.cloneNode(true);
        c.classList.add('export');
        $$('[contenteditable]', c).forEach(x => x.setAttribute('contenteditable', 'false'));
        $$('.cb', c).forEach(x => x.remove());
        c.style.boxShadow = 'none';
        const html = '<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">' +
          '<title>' + esc(S.out.name || 'excerpt') + '</title>' + links + '<style>' + st +
          '\nbody{margin:0;display:grid;place-items:start center;background:#e9e7e2;padding:24px}</style></head><body>' +
          c.outerHTML + '</body></html>';
        const blob = new Blob([html], { type: 'text/html' });
        const u = URL.createObjectURL(blob);
        dl(u, (S.out.name || 'excerpt') + '.html');
        setTimeout(() => URL.revokeObjectURL(u), 600);
        S.sel = wasSel; render();
      });
      $('#btnClearAll').addEventListener('click', () => {
        if (!S.blocks.length) { toast('이미 비어 있습니다'); return; }
        if (!confirm('블록을 전부 지울까요? 등록한 인물과 설정은 그대로 남습니다.')) return;
        snap();
        S.blocks = []; unbind(true); render(); save(); toast('전부 지웠습니다');
      });

      /* ===================== 저장 · 복원 ===================== */
      let dirty = false, wT = null, warned = false;
      function lean() {
        const o = JSON.parse(JSON.stringify(S));
        o.bg.img = null; o.sel = -1;
        return o;
      }
      function writeAll() {
        clearTimeout(wT); wT = null; dirty = false;
        const ok = Store.set(KEY, JSON.stringify(lean()));
        const d = new Date();
        $('#autoStat').textContent = '자동 저장됨 · ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        if (!ok && !warned) { warned = true; toast('저장 공간이 부족합니다. JSON으로 백업하세요'); }
      }
      function save() { dirty = true; clearTimeout(wT); wT = setTimeout(writeAll, 400); }

      /* ===== 블록 되돌리기 ===== */
      const undoStack = [], redoStack = [];
      function shot() { return JSON.stringify({ b: S.blocks, p: S.people }); }
      function snap() {
        undoStack.push(shot());
        if (undoStack.length > 30) undoStack.shift();
        redoStack.length = 0;
        syncUndo();
      }
      function restoreShot(str) {
        const o = JSON.parse(str);
        S.blocks = o.b; S.people = o.p;
        unbind(true); renderPeople(); render(); save(); syncUndo();
      }
      function undo() {
        if (!undoStack.length) { toast('되돌릴 것이 없습니다'); return; }
        redoStack.push(shot()); restoreShot(undoStack.pop()); toast('되돌렸습니다');
      }
      function redo() {
        if (!redoStack.length) { toast('다시 실행할 것이 없습니다'); return; }
        undoStack.push(shot()); restoreShot(redoStack.pop());
      }
      function syncUndo() { const b = $('#btnUndo'); if (b) b.disabled = !undoStack.length; }
      $('#btnUndo').addEventListener('click', undo);
      function flush() { if (dirty) writeAll(); }
      window.addEventListener('beforeunload', flush);
      window.addEventListener('pagehide', flush);
      document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
      setInterval(flush, 4000);
      function clampMins() {
        S.canvas.padX = Math.max(20, S.canvas.padX);
        S.canvas.padY = Math.max(30, S.canvas.padY);
        S.sign.gap = Math.max(20, S.sign.gap);
      }
      function load() {
        const raw = Store.get(KEY); if (!raw) return false;
        try { S = merge(defState(), JSON.parse(raw)); } catch (e) { return false; }
        S.sel = -1; clampMins();
        return true;
      }
      function presets() { try { return JSON.parse(Store.get(KEY + '.pre') || '{}'); } catch (e) { return {}; } }
      function setPresets(o) { Store.set(KEY + '.pre', JSON.stringify(o)); renderPresets(); }
      function renderPresets() {
        const o = presets(), s = $('#presetList'); s.innerHTML = '';
        const ks = Object.keys(o);
        if (!ks.length) { s.innerHTML = '<option value="">저장된 프리셋 없음</option>'; return; }
        ks.forEach(k => { const op = document.createElement('option'); op.value = k; op.textContent = k; s.appendChild(op); });
      }
      $('#btnPreSave').addEventListener('click', () => {
        const n = $('#presetName').value.trim(); if (!n) { toast('프리셋 이름을 입력하세요'); return; }
        const o = presets(); const c = lean(); delete c.blocks; o[n] = c; setPresets(o);
        $('#presetName').value = ''; toast('"' + n + '" 저장했습니다');
      });
      $('#btnPreLoad').addEventListener('click', () => {
        const n = $('#presetList').value, o = presets(); if (!n || !o[n]) return;
        const blocks = S.blocks, p = JSON.parse(JSON.stringify(o[n])); delete p.blocks;
        S = merge(defState(), p); S.blocks = blocks; S.sel = -1;
        syncAll(); render(); save(); toast('프리셋을 적용했습니다');
      });
      $('#btnPreDel').addEventListener('click', () => {
        const n = $('#presetList').value, o = presets(); if (!n || !o[n]) return;
        delete o[n]; setPresets(o); toast('삭제했습니다');
      });
      $('#btnExp').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify({ v: 3, state: lean(), presets: presets() }, null, 1)], { type: 'application/json' });
        const u = URL.createObjectURL(blob); dl(u, 'logx-backup.json'); setTimeout(() => URL.revokeObjectURL(u), 600);
      });
      $('#btnImp').addEventListener('click', () => $('#impFile').click());
      $('#impFile').addEventListener('change', e => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        const fr = new FileReader();
        fr.onload = () => {
          try {
            const o = JSON.parse(fr.result);
            if (o.state) S = merge(defState(), o.state);
            if (o.presets) Store.set(KEY + '.pre', JSON.stringify(o.presets));
            S.sel = -1; renderPresets(); syncAll(); render(); save(); toast('가져왔습니다');
          } catch (err) { toast('파일을 읽을 수 없습니다'); }
        };
        fr.readAsText(f); e.target.value = '';
      });
      $('#btnReset').addEventListener('click', () => {
        if (!confirm('모든 블록과 설정을 기본값으로 되돌릴까요?')) return;
        Store.del(KEY); S = defState(); syncAll(); render(); save();
      });
      document.addEventListener('keydown', e => {
        if (!(e.metaKey || e.ctrlKey)) return;
        const k = e.key.toLowerCase();
        if (k === 's') { e.preventDefault(); writeAll(); toast('저장했습니다'); return; }
        if (k === 'z' && document.activeElement !== field) {
          e.preventDefault(); e.shiftKey ? redo() : undo();
        }
      });

      /* ===================== 동기화 · 시작 ===================== */
      function syncAll() {
        syncers.forEach(f => f());
        seg('data-ratio', S.canvas.ratio); seg('data-cols', S.canvas.cols);
        seg('data-bgt', S.bg.type); seg('data-bgdir', S.bg.dir);
        seg('data-fw', S.type.fw); seg('data-ta', S.type.ta); seg('data-wrap', S.type.wrap);
        seg('data-btheme', S.bub.theme); seg('data-avsh', S.bub.avsh);
        seg('data-scale', S.out.scale); seg('data-fmt', S.out.fmt); seg('data-sgal', S.sign.al);
        syncBgRows(); syncEd(); renderPeople();
        ['dotText', 'dotSub', 'dotHlA', 'dotHlB', 'dotHlC'].forEach((id, i) => {
          const c = [S.color.text, S.color.sub, S.color.hlA, S.color.hlB, S.color.hlC][i];
          const el = $('#' + id); if (el) el.style.background = c;
        });
        Object.keys(S.ui.acc).forEach(k => {
          const a = $('.acc[data-acc="' + k + '"]'); if (a) a.classList.toggle('open', !!S.ui.acc[k]);
        });
        if (S.panelW) document.documentElement.style.setProperty('--panelW', S.panelW + 'px');
        ['min', 'half', 'max'].forEach(m => {
          const b = $('#sz' + m.charAt(0).toUpperCase() + m.slice(1)); if (b) b.classList.toggle('on', m === (S.sheet || 'half'));
        });
        $('#panel').classList.toggle('min', S.sheet === 'min');
      }
      function init() {
        load();
        renderPresets(); syncAll(); render(); syncUndo();
        if (S.sheet === 'max' && isNarrow()) setSheet('max');
        if (S.bg.imgRaw && !S.bg.img) rebuildBg();
        setTimeout(fit, 120);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      }
      init();
    })();
  </script>
</body>

</html>
